<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="小程序模板工坊 - 可视化搭建，一键导出小程序源码">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#eef2fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5985ff"/>
      <stop offset="100%" stop-color="#1f3ceb"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb88c"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c0ff"/>
      <stop offset="100%" stop-color="#6f86d6"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96e6a1"/>
      <stop offset="100%" stop-color="#3ec48d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
    <clipPath id="screen"><rect x="742" y="86" width="216" height="286" rx="4"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="150" fill="#3459f7" opacity="0.05"/>
  <circle cx="90" cy="380" r="120" fill="#3459f7" opacity="0.04"/>

  <!-- ================= 左侧文案 ================= -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="176" height="30" rx="15" fill="#ffffff" stroke="#d9e5ff"/>
    <circle cx="17" cy="15" r="4" fill="#3ec48d"/>
    <text x="30" y="20" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f3ceb" font-weight="600">纯前端 · 无需后端</text>

    <text x="0" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#191d28">小程序模板工坊</text>
    <text x="0" y="128" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#525a73">浏览器里可视化搭建，一键导出</text>
    <text x="0" y="157" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#525a73">可直接运行的微信小程序完整源码</text>

    <!-- 统计 -->
    <g transform="translate(0,196)">
      <text x="0" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1f3ceb">15</text>
      <text x="0" y="46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8590a8">行业模板</text>
      <rect x="70" y="4" width="1" height="42" fill="#d5d9e2"/>
      <text x="100" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1f3ceb">34</text>
      <text x="100" y="46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8590a8">业务组件</text>
      <rect x="176" y="4" width="1" height="42" fill="#d5d9e2"/>
      <text x="206" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1f3ceb">60</text>
      <text x="206" y="46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8590a8">预置页面</text>
      <rect x="282" y="4" width="1" height="42" fill="#d5d9e2"/>
      <text x="312" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1f3ceb">0</text>
      <text x="312" y="46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8590a8">行代码</text>
    </g>
  </g>

  <!-- ================= 中部流程 ================= -->
  <g transform="translate(72,352)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g>
      <rect x="0" y="0" width="104" height="34" rx="17" fill="#ffffff" filter="url(#tiny)"/>
      <text x="52" y="22" font-size="13" fill="#434a5e" text-anchor="middle">选模板</text>
    </g>
    <path d="M112 17 L134 17" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M129 13 L134 17 L129 21" fill="none" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="142" y="0" width="118" height="34" rx="17" fill="#ffffff" filter="url(#tiny)"/>
      <text x="201" y="22" font-size="13" fill="#434a5e" text-anchor="middle">可视化编辑</text>
    </g>
    <path d="M268 17 L290 17" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M285 13 L290 17 L285 21" fill="none" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="298" y="0" width="118" height="34" rx="17" fill="#ffffff" filter="url(#tiny)"/>
      <text x="357" y="22" font-size="13" fill="#434a5e" text-anchor="middle">导出源码</text>
    </g>
    <path d="M424 17 L446 17" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M441 13 L446 17 L441 21" fill="none" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="454" y="0" width="118" height="34" rx="17" fill="url(#brand)"/>
      <text x="513" y="22" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">双击即部署</text>
    </g>
  </g>

  <!-- ================= 右侧手机 ================= -->
  <g filter="url(#soft)">
    <rect x="730" y="62" width="240" height="334" rx="30" fill="#191d28"/>
    <rect x="738" y="70" width="224" height="318" rx="24" fill="#ffffff"/>
  </g>
  <rect x="836" y="76" width="28" height="5" rx="2.5" fill="#3a4050"/>

  <g clip-path="url(#screen)">
    <rect x="742" y="86" width="216" height="286" fill="#f6f7f9"/>
    <!-- 顶部导航 -->
    <rect x="742" y="86" width="216" height="34" fill="url(#brand)"/>
    <text x="850" y="108" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">潮流生活商城</text>
    <!-- 搜索栏 -->
    <rect x="754" y="130" width="192" height="26" rx="13" fill="#ffffff"/>
    <circle cx="770" cy="143" r="4.5" fill="none" stroke="#b0b8c9" stroke-width="1.4"/>
    <path d="M773.5 146.5 L777 150" stroke="#b0b8c9" stroke-width="1.4" stroke-linecap="round"/>
    <text x="784" y="147" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#b0b8c9">搜索你想要的商品</text>
    <!-- 轮播 -->
    <rect x="754" y="164" width="192" height="66" rx="10" fill="url(#warm)"/>
    <text x="768" y="192" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" font-weight="700">新品首发 5 折起</text>
    <rect x="768" y="200" width="52" height="16" rx="8" fill="#ffffff" opacity="0.9"/>
    <text x="794" y="211" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#ff7a59" font-weight="600" text-anchor="middle">立即抢购</text>
    <circle cx="893" cy="223" r="2.5" fill="#ffffff"/>
    <circle cx="902" cy="223" r="2.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="911" cy="223" r="2.5" fill="#ffffff" opacity="0.5"/>
    <!-- 宫格 -->
    <g>
      <rect x="758" y="240" width="30" height="30" rx="10" fill="#eef4ff"/>
      <rect x="766" y="248" width="14" height="14" rx="4" fill="#3459f7" opacity="0.75"/>
      <text x="773" y="280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#66718c" text-anchor="middle">上新</text>
      <rect x="804" y="240" width="30" height="30" rx="10" fill="#eef4ff"/>
      <circle cx="819" cy="255" r="7" fill="#3459f7" opacity="0.75"/>
      <text x="819" y="280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#66718c" text-anchor="middle">秒杀</text>
      <rect x="850" y="240" width="30" height="30" rx="10" fill="#eef4ff"/>
      <path d="M858 262 L865 248 L872 262 Z" fill="#3459f7" opacity="0.75"/>
      <text x="865" y="280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#66718c" text-anchor="middle">优惠</text>
      <rect x="896" y="240" width="30" height="30" rx="10" fill="#eef4ff"/>
      <rect x="903" y="247" width="16" height="16" rx="8" fill="none" stroke="#3459f7" stroke-width="2" opacity="0.75"/>
      <text x="911" y="280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#66718c" text-anchor="middle">会员</text>
    </g>
    <!-- 商品卡 -->
    <rect x="754" y="290" width="92" height="76" rx="10" fill="#ffffff"/>
    <rect x="754" y="290" width="92" height="42" rx="10" fill="url(#cool)"/>
    <rect x="762" y="338" width="60" height="6" rx="3" fill="#eceef2"/>
    <text x="762" y="358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff4d4f" font-weight="700">¥129</text>
    <rect x="854" y="290" width="92" height="76" rx="10" fill="#ffffff"/>
    <rect x="854" y="290" width="92" height="42" rx="10" fill="url(#mint)"/>
    <rect x="862" y="338" width="48" height="6" rx="3" fill="#eceef2"/>
    <text x="862" y="358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff4d4f" font-weight="700">¥89</text>
  </g>

  <!-- 悬浮按钮 -->
  <g filter="url(#tiny)">
    <rect x="898" y="330" width="52" height="26" rx="13" fill="url(#brand)"/>
  </g>
  <circle cx="912" cy="343" r="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="930" y="347" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle">客服</text>

  <!-- 导出代码浮标 -->
  <g transform="translate(596,132)" filter="url(#tiny)">
    <rect x="0" y="0" width="132" height="86" rx="12" fill="#191d28"/>
  </g>
  <g transform="translate(596,132)" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5">
    <circle cx="14" cy="15" r="3" fill="#ff5f57"/>
    <circle cx="24" cy="15" r="3" fill="#febc2e"/>
    <circle cx="34" cy="15" r="3" fill="#28c840"/>
    <text x="12" y="36" fill="#7dd3fc">&lt;template</text>
    <text x="12" y="49" fill="#a5b4fc">  name=</text>
    <text x="52" y="49" fill="#86efac">"mp-node"</text>
    <text x="12" y="62" fill="#7dd3fc">&gt;</text>
    <text x="12" y="76" fill="#64748b">// 34 个分支</text>
  </g>
  <path d="M728 176 L742 176" stroke="#b0b8c9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/>
</svg>
